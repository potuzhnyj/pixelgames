<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixelgames</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/logo/icon.ico" />
  </head>
  <body>
    <header>
      <nav class="h-nav" aria-label="Main navigation">
        <img class="h-nav-logo" src="assets/logo/logo.png" alt="pixelgames" />
        <div class="h-nav-div">
          <ul>
            <li><a href="index.html">Games</a></li>
            <li><a href="blog.html">Forum</a></li>

            <li><a href="articles.html">Articles</a></li>

            <li><a href="about.html">About</a></li>
          </ul>
          <ul>
            <li>
              <button type="button" class="find" aria-label="Open search">
                <img
                  src="./assets/icons/ui/find.svg"
                  alt=""
                  width="22"
                  height="22"
                />
              </button>
            </li>
            <li class="account">
              <img
                src="./assets/icons/ui/user.svg"
                alt=""
                width="24"
                height="24"
              />
              <p>My Account</p>
            </li>
          </ul>
        </div>
      </nav>
      <section class="hero">
        <h1>
          GOOD GAMES.<br />
          <span class="hero-accent">NO GUESSWORK.</span>
        </h1>
        <p>
          Discover hand-picked pixel games worth getting lost in.
          <br />
          From tiny indie gems to massive retro worlds.
        </p>
        <div class="search">
          <div class="search-bar">
            <input
              id="search"
              type="search"
              aria-label="Search games, genres or game modes"
              placeholder="Search for games, genres or online options..."
            />
            <button type="button">Search</button>
          </div>

          <div class="search-suggestions">
            <span>Try:</span>
            <ul id="search-recommendations" class="search-options"></ul>
          </div>
        </div>
      </section>
    </header>
    <main>
      <nav class="main-nav" aria-label="Game filters and sorting">
        <ul class="game-filters">
          <li>
            <button type="button" id="reset-filters" class="active">
              <img src="./assets/icons/ui/all.svg" alt="" class="genre-icon" />
              <span>All games</span>
            </button>
          </li>
          <li>
            <select id="filter-genre" name="genre" aria-label="Genre">
              <option value="">Genre</option>
              <option value="RPG">RPG</option>
              <option value="Action">Action</option>
              <option value="Adventure">Adventure</option>
              <option value="Strategy">Strategy</option>
              <option value="Simulation">Simulation</option>
              <option value="Survival">Survival</option>
              <option value="Racing">Racing</option>
            </select>
          </li>
          <li>
            <select id="filter-gameplay" name="gameplay" aria-label="Gameplay">
              <option value="">Gameplay</option>
              <option value="Open World">Open World</option>
              <option value="Exploration">Exploration</option>
              <option value="Story Rich">Story Rich</option>
              <option value="Base Building">Base Building</option>
              <option value="Crafting">Crafting</option>
              <option value="Puzzle">Puzzle</option>
            </select>
          </li>
          <li>
            <select id="filter-mode" name="mode" aria-label="Game mode">
              <option value="">Game mode</option>
              <option value="Single-player">Single-player</option>
              <option value="Co-op">Co-op</option>
              <option value="Multiplayer">Multiplayer</option>
            </select>
          </li>
        </ul>
        <div class="main-sort">
          <label for="sort">Sort by:</label>

          <select id="sort" name="sort">
            <option value="popular">Popularity</option>
            <option value="title-asc">Name: A–Z</option>
            <option value="title-desc">Name: Z–A</option>
            <option value="rating-desc">Rating: High–Low</option>
            <option value="rating-asc">Rating: Low–High</option>
          </select>
        </div>
      </nav>
      <div id="cardsList" class="cards"></div>
    </main>
    <footer>
      <div>pixelgames</div>
    </footer>
    <script src="scripts/app.js"></script>
  </body>
</html>
